# Full stack locally: PostgreSQL, Redis, FastAPI and Next.js.
#   docker compose up --build
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cleanroom
      POSTGRES_PASSWORD: cleanroom
      POSTGRES_DB: cleanroom
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanroom"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cleanroom:cleanroom@db:5432/cleanroom
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes: [warehouse:/app/warehouse]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  warehouse:
